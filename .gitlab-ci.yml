image: ubuntu:22.04
stages:
  - dev   

# Versión desarrollo
dev-job:
  stage: dev
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY_CHATBOT" ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

    - ssh-keyscan -H ${SERVER_IP_CHATBOT} >> ~/.ssh/known_hosts

  script:
    - echo "Iniciando proceso Deploy dev..."
    - cp "$ENV" .env
    # Test de conexión
    - ssh ${USER_CHATBOT}@${SERVER_IP_CHATBOT} "echo '✓ Conexión exitosa'"
    - scp -r  * ${USER_CHATBOT}@${SERVER_IP_CHATBOT}:/home/openwebui-deploy
    - scp -r  .env ${USER_CHATBOT}@${SERVER_IP_CHATBOT}:/home/openwebui-deploy
    - ssh  ${USER_CHATBOT}@${SERVER_IP_CHATBOT} "cd /home/openwebui-deploy && docker compose down -v && docker compose up -d --build" 
    - echo "desplegado versión desarrollo en chatbot ${SERVER_IP_CHATBOT}:3031"
  only:
    - dev  
