image: ubuntu:22.04
stages:
  - dev
  - testing

# Versión desarrollo
dev-job:
  stage: dev
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY_CHATBOT" ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - apt-get install -y -qq curl
    - curl -s https://ifconfig.me || wget -qO- https://ifconfig.me
    - timeout 5 bash -c "cat < /dev/null > /dev/tcp/${SERVER_IP_CHATBOT}/22" && echo "port 22 reachable" || echo "port 22 UNREACHABLE"
    - ssh-keyscan -v -H ${SERVER_IP_CHATBOT} >> ~/.ssh/known_hosts

  script:
    - echo "Iniciando proceso Deploy dev..."
    - cp "$ENV" .env
    # Test de conexión
    - ssh ${USER_CHATBOT}@${SERVER_IP_CHATBOT} -i ~/.ssh/id_rsa "echo '✓ Conexión exitosa'"
    - scp -r  * ${USER_CHATBOT}@${SERVER_IP_CHATBOT}:/home/openwebui-deploy
    - scp -r  .env ${USER_CHATBOT}@${SERVER_IP_CHATBOT}:/home/openwebui-deploy
    - ssh  ${USER_CHATBOT}@${SERVER_IP_CHATBOT} -i ~/.ssh/id_rsa "cd /home/openwebui-deploy && docker compose down -v && docker compose up -d --build"
    - echo "desplegado versión desarrollo en chatbot ${SERVER_IP_CHATBOT}:3031"
  only:
    - dev

# Host de testing controlado (HSCHBOTT01 / 10.91.161.91).
# Sin acceso directo a docker: el despliegue SOLO puede pasar por el wrapper
#   sudo /usr/local/sbin/openwebui-testing {config,up,down,restart}
# El wrapper valida (validate_policy) puertos, mounts, network/privileged y, en
# especial, exige que docker-compose.testing.yml sea propiedad de
#   root:openwebui-testing  o  openwebui-deploy:openwebui-testing  (modo 640/660/440/644/664/444).
# Como jeconchao NO puede chown a root/openwebui-deploy, el archivo compose debe
# existir ya en el host con ese owner y grupo-escritura (664), y aquí SOLO se
# actualiza su CONTENIDO in-place (scp sobreescribe el inodo, conserva el owner).
# rsync por defecto (temp+rename) cambiaría el owner a jeconchao -> exit 4, por eso
# la compose va por scp y NO por rsync.
testing-job:
  stage: testing
  variables:
    SERVER_IP_TESTING: "10.91.161.91"
    USER_TESTING: "jeconchao"
    REMOTE_DIR: "/opt/open-webui-testing/compose"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY_TESTING" ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H ${SERVER_IP_TESTING} >> ~/.ssh/known_hosts
  script:
    - echo "Deploy a host de testing controlado (${SERVER_IP_TESTING})..."
    # .env.prod viene de la variable protegida $ENV (NO del repo, está gitignored)
    - cp "$ENV" .env.prod && chmod 600 .env.prod
    # Sincroniza el contexto de build. Excluye:
    #  - docker-compose.testing.yml -> se actualiza aparte, in-place (ver abajo)
    #  - data/ -> grande y :ro, se coloca UNA vez en el host
    #  - .git/ -> innecesario
    # --exclude protege esos paths de --delete, así data/ nunca se borra.
    - rsync -az --delete-after --exclude 'docker-compose.testing.yml' --exclude 'data/' --exclude '.git/' -e "ssh -i ~/.ssh/id_rsa" ./ "${USER_TESTING}@${SERVER_IP_TESTING}:${REMOTE_DIR}/"
    # La compose se sobreescribe con scp (conserva owner root:openwebui-testing / modo 664)
    - scp -i ~/.ssh/id_rsa docker-compose.testing.yml "${USER_TESTING}@${SERVER_IP_TESTING}:${REMOTE_DIR}/docker-compose.testing.yml"
    # Verifica que el owner/modo siguen siendo válidos ANTES de intentar desplegar
    - ssh -i ~/.ssh/id_rsa "${USER_TESTING}@${SERVER_IP_TESTING}" "stat -c 'owner=%U:%G mode=%a' ${REMOTE_DIR}/docker-compose.testing.yml"
    # Valida política del compose (falla el pipeline si algo no cumple)
    - ssh -i ~/.ssh/id_rsa "${USER_TESTING}@${SERVER_IP_TESTING}" "sudo /usr/local/sbin/openwebui-testing config"
    # Despliega SOLO vía wrapper (build + up -d). 'up prod' == perfil prod;
    # si la compose no usa perfiles, los servicios sin profile arrancan igual.
    - ssh -i ~/.ssh/id_rsa "${USER_TESTING}@${SERVER_IP_TESTING}" "sudo /usr/local/sbin/openwebui-testing up prod"
    - ssh -i ~/.ssh/id_rsa "${USER_TESTING}@${SERVER_IP_TESTING}" "sudo /usr/local/sbin/openwebui-testing ps"
    - echo "Desplegado en host de testing ${SERVER_IP_TESTING}:3030 (vía wrapper)"
  only:
    - master
  when: manual
