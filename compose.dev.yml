# DESARROLLO / DEMO — solo OpenRouter (sin Ollama).
# Credenciales en .env (gitignored). DB solo en loopback.
name: chatbot-dev

services:
  open-webui-dev:
    build:
      context: .
      dockerfile: Dockerfile.openwebui
      target: dev
    container_name: open-webui-dev
    security_opt:
      - no-new-privileges:true
    ports:
      - "3031:8080"
    volumes:
      - open-webui-dev:/app/backend/data
      # Mount configuration files for hot-reload on restart
      - ./exports/postgres-tool-export.json:/app/exports/postgres-tool-export.json:ro
      - ./exports/models-export-dev.json:/app/exports/models-export.json:ro
      - ./exports/config-export-dev.json:/app/exports/config-export.json:ro
      - ./exports/filter-export.json:/app/exports/filter-export.json:ro
      - ./import_tools.py:/app/import_tools.py:ro
      - ./start_with_tools.sh:/app/start_with_tools.sh:ro
      - ./src:/app/backend/src:ro
      - ./system_prompt.md:/app/system_prompt.md:ro
      - ./hf_models:/app/backend/hf_models:ro
    restart: unless-stopped
    depends_on:
      db-dev:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db-dev
      POSTGRES_PORT: 5432
      ENABLE_OLLAMA_API: "false"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    networks:
      - dev-net

  db-dev:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: toy-postgres-dev
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./load_parquet_to_db_auto.py:/scripts/load_parquet_to_db_auto.py:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    networks:
      - dev-net

volumes:
  # Nombres explícitos para conservar los volúmenes ya existentes
  # (creados cuando el proyecto compose se llamaba "open-webui")
  open-webui-dev:
    name: open-webui_open-webui-dev
  pgdata-dev:
    name: open-webui_pgdata-dev

networks:
  dev-net:
